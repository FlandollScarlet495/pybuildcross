[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybuildcross"
version = "1.0.0a1"
description = "Cross-compile Python and HTML scripts into standalone executables using a lightweight Go backend."
readme = "README.md"
authors = [
    { name = "Kirishima Aoi" }
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/FlandollScarlet495/pybuildcross"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybuildcross = [
    "python_builder/windows/*",
    "python_builder/mac/*",
    "python_builder/linux/*"
]
